  - id: anketa_text
    title: "АНКЕТА Текстом"
    desc: "36 питань, 9 блоків"
    messages:
      - text: |
          ✍️ <b>АНКЕТА ДЛЯ БІЗНЕС-ПЛАНУ</b>

          📌 Скопіюйте це повідомлення → відповідайте під кожним пунктом → надішліть назад. Загальне бачення — ваше, конкретику розрахуємо разом.

          👉 <b>БЛОК 1. СТАТУС ПРОГРАМИ</b>
          1. Програма: Старт (новий бізнес) / Масштабування (діючий бізнес)
          2. Суб'єкт господарювання: ФОП / ТОВ / ПП / ще не зареєстрований
          3. ЄДРПОУ / ІПН (якщо вже є)
          4. Дата реєстрації (для Масштабування)

          👤 <b>БЛОК 2. ВЛАСНИК</b>
          5. ПІБ
          6. Контакти: телефон, email, Telegram
          7. Статус для гранту: ВПО / ветеран / УБД / інший пільговий / немає
          8. Освіта та спеціалізація
          9. Досвід у сфері бізнесу (роки, попередня діяльність)

          🏗 <b>БЛОК 3. ПРО БІЗНЕС</b>
          10. Назва бізнесу
          11. Місто / регіон діяльності
          12. КВЕДи (основні коди)
          13. Система оподаткування: 1–3 група ФОП / загальна / інша
          14. Опис діяльності — що робите / будете робити (2–3 речення)
          15. Бачення / місія — чим вирізняється ідея (2–3 речення)

          ⛏ <b>БЛОК 4. ПЕРСОНАЛ</b>
          16. Наймані працівники зараз (кількість, посади — для Масштабування)
          17. Плануєте найняти: скільки осіб і на які посади
          (бонус +20 %: Старт — 2 нові місця; Масштабування — 1 обов'язкове + 2 = 3)
          18. Власна зайнятість: працюєте в бізнесі самі / лише управління

          🎯 <b>БЛОК 5. РИНОК ТА КЛІЄНТИ</b>
          19. Цільова аудиторія: вік, інтереси, профіль клієнтів
          20. Конкуренти: хто у вашому місті / онлайн, їхні сильні сторони
          21. Ваша перевага: чому оберуть саме вас
          22. Канали збуту: офлайн-точка / онлайн / обидва

          🛍 <b>БЛОК 6. ІНФРАСТРУКТУРА</b>
          23. Приміщення: власне / оренда / плануєте орендувати / не потрібно
          24. Адреса / район (якщо відомо)
          25. Площа, кв. м
          26. Стан приміщення: під ремонт / готове / потребує облаштування
          27. Що плануєте придбати: обладнання, меблі, товар, інструмент — списком

          💰 <b>БЛОК 7. ФІНАНСИ ТА ГРАНТ</b>
          28. Власні початкові інвестиції — сума
          29. Сума гранту, яку плануєте отримати
          30. Використання гранту по статтях: чітко НАЙМЕНУВАННЯ — КІЛЬКІСТЬ — ЦІНА
          31. Основні щомісячні витрати: оренда, зарплата, комуналка, закупівлі

          📣 <b>БЛОК 8. МАРКЕТИНГ ТА ОНЛАЙН</b>
          32. Канали просування: Instagram, Facebook, Google, офлайн-реклама, заходи, інше
          33. Маркетингові активності: акції, знижки, програми лояльності
          34. Онлайн-присутність: сайт, маркетплейси (Prom, Rozetka), система запису

          📎 <b>БЛОК 9. ДОДАТКОВО</b>
          35. Проблеми / виклики, які бачите
          36. Що важливо врахувати в бізнес-плані

          🚀 Надішліть заповнену анкету — і розпочнемо роботу над бізнес-планом!

  - id: dilo
    title: "Діло ЖИТТЯ"
    desc: "Текст про Діло + Компас"
    messages:
      - text: |
          🧭 <b>Діло життя</b>

          Кожного чоловіка в житті визначає лише його Діло. Не діти, не дружина і не суспільство скажуть, ким він є насправді. Лише Діло відкриває справжню суть чоловіка.

          Знайти своє Діло — завдання цілком реальне. Потрібно чесно визначити, що для вас по-справжньому важливе або що ви щиро любите. Саме це стає надійним фундаментом. Не тому, що хтось порадив, не тому, що прочитали в інтернеті, і не тому, що «сусід уже робить». А тому, що саме ви особисто це любите або це має для вас глибоке внутрішнє значення.

          🔎 Проста практика: поверніться спогадами у вік 10–14 років і згадайте, що тоді приносило радість — риболовля, футбол, автомобілі, географія, тварини, рослини… Або що було настільки важливим, що ви готові були присвячувати цьому час і сили. Можливо, це електроенергія — її генерація, накопичення чи передача; вода — тала, жива або її очищення; земля, екологія та природа загалом.

          Критично проаналізуйте ці напрямки та оберіть ті, що справді відгукуються. Назвіть їх мені — і я розроблю повноцінну архітектуру бізнесу та реалістичну модель заробітку на їх основі. А далі допоможу отримати грантове фінансування.

          👥 Тест підходить дорослим, які відчувають, що працюють не на своєму місці; підліткам і батькам, які обирають напрям навчання; підприємцям, які хочуть звірити ідею зі своїм реальним талантом, а не з модою на нішу. Особливо корисний тим, хто вже проходив стандартні тести на профорієнтацію й отримав розмитий результат.

          🔗 https://uncleevan.watt-coin.org/kompas/

  - id: vs_terms
    title: "В.С.2.0 - Умови Текст"
    desc: "Суми, бонуси, пам'ятка, обов'язки"
    messages:
      - text: |
          🇺🇦 <b>«Власна справа 2.0»</b> — оновлена з 1 вересня 2026 року державна програма безповоротних грантів для підприємців.

          Два напрями:
          🟢 <b>«Старт»</b> — 100–300 тис. грн (до 500 тис. грн з бонусами) на новий бізнес
          🔵 <b>«Масштабування»</b> — 0,5–1,5 млн грн (до 2,5 млн грн з бонусами) на розвиток діючого

          Заявку подають через Дію разом з бізнес-планом — і саме він вирішує, скільки ви отримаєте і чи отримаєте взагалі.

          💰 <b>Сума гранту</b> = базова сума за бізнес-планом + бонуси:
          ➕ 5 % — вік 18–25
          ➕ 20 % — ветеран, ВПО, платник ПДВ, власник патенту, нові робочі місця
          ➕ 30 % — прифронтова територія, відновлення знищеного майна
          ➕ 50 % — пріоритетний сектор
          Стеля — 500 тис. грн на старт і 2,5 млн грн на масштабування.

          👷 <b>Бонус +20 % за робочі місця</b>
          «Старт» — створити 2 нові робочі місця.
          «Масштабування» — 1 нове місце обов'язкове за програмою, для бонусу потрібно ще 2 — разом 3.
          Місця створюють протягом 3 місяців після зарахування коштів і утримують не менш як 18, 24 або 54 місяці.
      - text: *memo
      - text: |
          📑 <b>Обов'язки після отримання гранту</b>
          • Зареєструвати ФОП/ТОВ і відкрити рахунок — 20 календарних днів («Старт»); підписати договір — 10 робочих днів («Масштабування»)
          • Використати кошти за призначенням — протягом 3 місяців
          • Сплатити податків і ЄСВ не менше, ніж сума гранту за період проєкту
          • Якщо обіцяли робочі місця — працевлаштувати людей за 3 місяці і утримувати 18–54 місяці
          • Якщо майно знищене внаслідок агресії РФ — повертати кошти не потрібно, можна подати заявку повторно

          🎯 <b>Чому бізнес-план вирішує все</b>
          Банк-партнер перевіряє формальності: реєстраційні дані, кредитну історію, борги. А життєздатність ідеї, обґрунтованість кошторису і реальність цілей оцінюють за бізнес-планом. У 2.0 суму в межах діапазону ви доводите цифрами.

          ⛔ <b>Найчастіші причини відмови</b>
          • стаття кошторису виходить за ліміт (реклама понад 10 %, оренда понад 25 %)
          • обладнання в кошторисі не пов'язане з описом бізнесу
          • немає аналізу ринку і цільової аудиторії — тільки «клієнтів багато»
          • фінансові прогнози не сходяться: доходи не покривають податки, ЄСВ і зобов'язання
          • цілі скопійовані «під копірку» і нічого не вимірюють
          • заборонений КВЕД — перевіряю його ще до початку роботи

