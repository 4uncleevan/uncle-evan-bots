  - id: dilo
    title: "Діло ЖИТТЯ"
    desc: "Текст про Діло + Компас"
    messages:
      - text: |
          Кожного чоловіка в житті визначає лише його Діло. Не діти, не дружина і не суспільство скажуть, ким він є насправді. Лише Діло відкриває справжню суть чоловіка.

          Знайти своє Діло — завдання цілком реальне. Для цього потрібно чесно визначити, що для вас є по-справжньому важливим або що ви щиро любите. Саме це і стає надійним фундаментом. Не тому, що хтось порадив, не тому, що прочитали в інтернеті, і не тому, що «сусід уже робить, отже, і я буду». А тому, що саме ви особисто це любите або це має для вас глибоке внутрішнє значення.

          Щоб виявити те, що справді резонує, варто провести просту психологічну практику. Поверніться спогадами в період, коли вам було 10–14 років, і згадайте, що тоді приносило вам радість — риболовля, футбол, автомобілі, географія, тварини, рослини… Або що було настільки важливим, що ви готові були присвячувати цьому свій час і сили, навіть якщо це вимагало зусиль і жертв. Можливо, це були напрямки, пов'язані з електроенергією — її генерацією, накопиченням чи передачею; з водою — талою, живою або її очищенням; із землею, екологією та природою загалом.

          Критично проаналізуйте ці напрямки та оберіть ті, які справді відгукуються саме у вас. Назвіть їх мені — і я розроблю для вас повноцінну архітектуру бізнесу та реалістичну модель заробітку на їх основі. А далі допоможу отримати грантове фінансування для втілення цієї ідеї в життя.

          Тест підходить дорослим, які відчувають, що працюють не на своєму місці, підліткам і батькам, які обирають напрям навчання, і підприємцям, які хочуть звірити бізнес-ідею зі своїм реальним талантом, а не з модою на нішу. Особливо корисний тим, хто вже проходив стандартні тести на профорієнтацію й отримав розмитий або очевидний результат.

          https://uncleevan.watt-coin.org/kompas/

  - id: vs_terms
    title: "В.С.2.0 - Умови Текст"
    desc: "Суми, бонуси, ліміти, обов'язки"
    messages:
      - text: |
          <b>«Власна справа 2.0»</b> — це оновлена з 1 вересня 2026 року державна програма безповоротних грантів для підприємців. Два напрями: <b>«Старт»</b> — 100–300 тис. грн (до 500 тис. грн з бонусами) на новий бізнес, і <b>«Масштабування»</b> — 0,5–1,5 млн грн (до 2,5 млн грн з бонусами) на розвиток діючого. Заявку подають через Дію разом з бізнес-планом — і саме він вирішує, скільки ви отримаєте і чи отримаєте взагалі.

          <b>Сума гранту</b> = базова сума за бізнес-планом + відсоткові бонуси: +5 % (вік 18–25), +20 % (ветеран, ВПО, платник ПДВ, власник патенту, створення нових робочих місць), +30 % (прифронтова територія, відновлення знищеного майна), +50 % (пріоритетний сектор). Стеля — 500 тис. грн на старт і 2,5 млн грн на масштабування.

          <b>Бонус +20 % за робочі місця.</b> На «Старті» потрібно створити 2 нові робочі місця. На «Масштабуванні» одне нове місце обов'язкове за програмою, тож для бонусу потрібно взяти ще 2 — разом 3. Місця створюють протягом 3 місяців після зарахування коштів і утримують не менш як 18, 24 або 54 місяці.
      - text: *memo
      - text: |
          <b>Обов'язки після отримання гранту</b>
          • Зареєструвати ФОП/ТОВ і відкрити рахунок — 20 календарних днів («Старт»); підписати договір — 10 робочих днів («Масштабування»).
          • Використати кошти за призначенням — протягом 3 місяців.
          • Сплатити податків і ЄСВ не менше, ніж сума гранту за період проєкту.
          • Якщо обіцяли робочі місця — працевлаштувати людей протягом 3 місяців і утримувати 18–54 місяці.
          • Якщо майно знищене внаслідок агресії РФ — повертати кошти не потрібно, можна подати заявку повторно.

          <b>Чому бізнес-план вирішує, отримаєте ви грант чи ні.</b> Банк-партнер перевіряє формальності: реєстраційні дані, кредитну історію, борги. Але життєздатність ідеї, обґрунтованість кошторису і реальність цілей оцінюють за бізнес-планом. У 2.0 суму в межах діапазону ви доводите цифрами.

          <b>Найчастіші причини відмови:</b>
          • стаття кошторису виходить за ліміт (реклама понад 10 %, оренда понад 25 %);
          • обладнання в кошторисі не пов'язане з описом бізнесу;
          • немає аналізу ринку і цільової аудиторії — тільки «клієнтів багато»;
          • фінансові прогнози не сходяться: доходи не покривають податки, ЄСВ і обов'язки перед державою;
          • цілі скопійовані «під копірку» і нічого не вимірюють;
          • заборонений КВЕД — перевіряю його ще до початку роботи.

