async function copyToClipboard(txt){
try{
if(navigator.clipboard && navigator.clipboard.writeText){
await navigator.clipboard.writeText(txt); return true;
}
}catch(e){}
try{
const ta=document.createElement('textarea');
ta.value=txt; ta.style.position='fixed'; ta.style.opacity='0';
document.body.appendChild(ta); ta.focus(); ta.select();
const ok=document.execCommand('copy');
document.body.removeChild(ta); return ok;
}catch(e){ return false; }
}
function sendMsg(t,bad,id){
const el=document.getElementById(id||'sendok');
if(el){ el.textContent=t; el.classList.toggle('bad',!!bad); }
}

const b=document.getElementById('mailbox');b.hidden=!b.hidden;

async function sendEmail(){
if(SENDING)return;
const inp=document.getElementById('mailTo'),btn=document.getElementById('bGo');
const em=(inp.value||'').trim().toLowerCase();
if(!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(em)){inp.classList.add('bad');sendMsg('Перевірте пошту — має бути як ivan@gmail.com',1,'mailmsg');inp.focus();return;}
inp.classList.remove('bad');
const txt=buildTxt();
SENDING=true;btn.disabled=true;btn.textContent='Надсилаю…';sendMsg('',0,'mailmsg');

try{

body:JSON.stringify({_subject:'Анкета «Власна справа» — '+(S.pib||'')+(S.bizname?' · '+S.bizname:''),name:S.pib||'',email:em,phone:S.phone||'',telegram:S.tg||'',message:txt,_template:'box',_captcha:'false',_honey:document.getElementById('mailHp').value,_autoresponse:'Добрий день! Вашу анкету на грант «Власна справа» отримано, нижче — її копія. Uncle Evan відповість Вам за вказаними контактами.'})});
const d=await r.json().catch(()=>({}));

}catch(e){}
SENDING=false;btn.disabled=false;
if(ok){
btn.textContent='Надіслано ✓';btn.classList.add('done');
sendMsg('Готово ✓ Анкета вже в Uncle Evan, копія — на '+em+'. Не бачите листа — перевірте «Спам».',0,'mailmsg');
}else{
btn.textContent='Спробувати ще раз';
await copyToClipboard(txt);
const el=document.getElementById('mailmsg');
el.classList.add('bad');
el.innerHTML='Лист не пішов. Текст анкети вже скопійовано — <a href="mailto:'+OWNER_MAIL+'?cc='+encodeURIComponent(em)+'&subject='+encodeURIComponent('Анкета «Власна справа» — '+(S.pib||''))+'" target="_blank">відкрийте лист у своїй пошті</a> і вставте його (Ctrl+V).';

}

t+='БОНУСИ:\n'+g.B.map(b=>'  ['+(b.on?'x':' ')+'] +'+b.p+'%  '+b.l).join('\n')+'\n  РАЗОМ: +'+g.pct+'%\n\n';
if(g.warn.length)t+='УВАГА:\n'+g.warn.map(w=>'  ! '+w).join('\n')+'\n\n';
t+='-'.repeat(56)+'\nАНКЕТА\n'+'-'.repeat(56)+'\n';
rows().forEach(r=>{t+=r[0]==='__s'?'\n['+r[1].toUpperCase()+']\n':r[0]+': '+r[1]+'\n';});
const its=(S.items||[]).filter(i=>i.name);
if(its.length){
t+='\n'+'-'.repeat(56)+'\nКОШТОРИС\n'+'-'.repeat(56)+'\n';
its.forEach((i,n)=>{t+=(n+1)+'. '+i.name+' | '+(i.cat||'')+' | '+fmt(i.qty)+' × '+fmt(i.price)+' = '+fmt((+i.qty||0)*(+i.price||0))+' грн\n';});
t+='РАЗОМ: '+grn(iTot())+'\n';
if(S.own)t+='Свої гроші: '+grn(S.own)+'\n';
}
if(mTot()>0){
t+='\nВИТРАТИ НА МІСЯЦЬ\n';
MONTHLY_CATS.forEach(c=>{const v=+(S.monthly||{})[c]||0;if(v>0)t+='  '+c+': '+fmt(v)+' грн\n';});
t+='  РАЗОМ: '+grn(mTot())+'\n';
}
t+='\n'+'-'.repeat(56)+'\nДЖЕРЕЛА\n'+'-'.repeat(56)+'\n';
SOURCES.forEach(s=>{t+=s.t+'\n  '+s.u+'\n';});
return t;
}
