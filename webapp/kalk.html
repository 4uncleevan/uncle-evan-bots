const endY=msgs.getBoundingClientRect().bottom;
if(wide){

}else{

}

}

['Пільги та умови',S.on.length?CHIPS.filter(c=>has(c.k)).map(c=>c.l).join('; '):'немає']];
}
function buildTxt(){
const g=calc();
let t='РОЗРАХУНОК ГРАНТУ «ВЛАСНА СПРАВА» (з 01.09.2026)\nUncle Evan · Економічний архітектор майбутнього\n'+'='.repeat(52)+'\n\n';
t+='СУМА ГРАНТУ, НА ЯКУ ПОДАЄМОСЯ: '+grn(g.sum)+'\n\n';
t+='ВАШІ ВІДПОВІДІ:\n';
answersRows().forEach(r=>{t+='  '+r[0]+': '+r[1]+'\n';});
t+='\nРОЗРАХУНОК:\n  База '+fmt(g.base)+' грн\n  Бонуси +'+g.pct+'%\n  Множник × '+g.mult.toFixed(2)+
'\n  Виходить '+fmt(g.raw)+' грн\n  Стеля '+fmt(g.cap)+' грн\n  ПІДСУМОК: '+grn(g.sum)+'\n\n';
t+='БОНУСИ:\n'+g.B.map(b=>'  ['+(b.on?'x':' ')+'] +'+b.p+'%  '+b.l).join('\n')+'\n  РАЗОМ: +'+g.pct+'%\n';
if(g.warn.length)t+='\nУВАГА:\n'+g.warn.map(w=>'  ! '+w).join('\n')+'\n';
t+='\nДЖЕРЕЛА:\n';
SOURCES.forEach(s=>{t+='  '+s.t+'\n    '+s.u+'\n';});
t+='\nПідстава: постанова КМУ №738 у редакції №616 від 15.05.2026, п.6.\n';
t+='Розрахунок орієнтовний. Рішення ухвалює Державний центр зайнятості.\n';
return t;
}
async function copyToClipboard(txt){
try{if(navigator.clipboard&&navigator.clipboard.writeText){await navigator.clipboard.writeText(txt);return true;}}catch(e){}
try{const ta=document.createElement('textarea');ta.value=txt;ta.style.position='fixed';ta.style.opacity='0';
document.body.appendChild(ta);ta.focus();ta.select();const ok=document.execCommand('copy');document.body.removeChild(ta);return ok;}catch(e){return false;}
}
function sendMsg(t,bad,id){const el=$(id||'sendok');if(el){el.textContent=t;el.classList.toggle('bad',!!bad);}}
function toggleMail(){const b=$('mailbox');b.hidden=!b.hidden;if(!b.hidden&&!$('mailTo').value)$('mailTo').focus();}
let SENDING=false;
async function sendEmail(){
if(SENDING)return;
const inp=$('mailTo'),btn=$('bGo');
const em=(inp.value||'').trim().toLowerCase();
if(!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(em)){inp.classList.add('bad');sendMsg('Перевірте пошту — має бути як ivan@gmail.com',1,'mailmsg');inp.focus();return;}
inp.classList.remove('bad');
const txt=buildTxt(),g=calc();
SENDING=true;btn.disabled=true;btn.textContent='Надсилаю…';sendMsg('',0,'mailmsg');
let ok=false;
try{
const r=await fetch(MAIL_API,{method:'POST',headers:{'Content-Type':'application/json','Accept':'application/json'},
body:JSON.stringify({_subject:'Розрахунок гранту «Власна справа» — '+grn(g.sum),email:em,message:txt,_template:'box',_captcha:'false',_honey:$('mailHp').value,_autoresponse:'Добрий день! Нижче — Ваш розрахунок суми гранту «Власна справа». Наступний крок — анкета для бізнес-плану: '+ANKETA_URL})});
const d=await r.json().catch(()=>({}));
ok=r.ok&&d&&(d.success===true||d.success==='true');
}catch(e){}
SENDING=false;btn.disabled=false;
if(ok){btn.textContent='Надіслано ✓';btn.classList.add('done');
sendMsg('Готово ✓ Розрахунок на '+em+' і в Uncle Evan. Не бачите листа — перевірте «Спам».',0,'mailmsg');}
else{btn.textContent='Спробувати ще раз';
await copyToClipboard(txt);
const el=$('mailmsg');el.classList.add('bad');
el.innerHTML='Лист не пішов. Текст розрахунку вже скопійовано — <a href="mailto:'+OWNER_MAIL+'?cc='+encodeURIComponent(em)+'&subject='+encodeURIComponent('Розрахунок гранту «Власна справа»')+'" target="_blank">відкрийте лист у своїй пошті</a> і вставте його (Ctrl+V).';}
}
async function copyAll(){
const b=$('bCopy');
const ok=await copyToClipboard(buildTxt());
if(ok){b.textContent='Скопійовано ✓';b.classList.add('done');
setTimeout(()=>{b.textContent='⧉ Скопіювати розрахунок';b.classList.remove('done');},3500);
sendMsg('Розрахунок у буфері. Відкрийте переписку з Uncle Evan і вставте (Ctrl+V або «Вставити»).');
$('bTg').hidden=false;}
else{sendMsg('Автоматично не скопіювалось. Нижче текст — виділіть його і скопіюйте.',1);openTxt(true);}
}
function openTxt(force){
const b=$('txtbox'),a=$('ta');
if(!b.hidden&&!force){b.hidden=true;return;}
a.value=buildTxt();b.hidden=false;
setTimeout(()=>{a.focus();a.select();},60);
}
build();
